<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login - AI Team</title>

 <!-- Premium Design System -->
 <link rel="stylesheet" href="{{ url_for('static', filename='premium-design.css') }}">

 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 }

 body {
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 background: linear-gradient(135deg, #3aa76d 0%, #4fb883 50%, #3aa76d 100%);
 min-height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 position: relative;
 overflow: hidden;
 }

 /* Animated jungle background */
 .jungle-bg {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 pointer-events: none;
 z-index: 0;
 }

 .leaf {
 position: absolute;
 width: 60px;
 height: 80px;
 background: rgba(76, 175, 80, 0.15);
 border-radius: 0 50% 50% 0;
 animation: float 6s ease-in-out infinite;
 }

 @keyframes float {
 0%, 100% { transform: translateY(0) rotate(0deg); }
 50% { transform: translateY(-20px) rotate(5deg); }
 }

 .container {
 background: rgba(255, 255, 255, 0.95);
 padding: 3rem;
 border-radius: 20px;
 box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
 width: 100%;
 max-width: 450px;
 position: relative;
 z-index: 1;
 }

 .logo {
 text-align: center;
 margin-bottom: 2rem;
 }

 .logo h1 {
 color: #2d8659;
 font-size: 2.5rem;
 margin-bottom: 0.5rem;
 }

 .logo p {
 color: #666;
 font-size: 1rem;
 }

 .form-group {
 margin-bottom: 1.5rem;
 }

 label {
 display: block;
 margin-bottom: 0.5rem;
 color: #333;
 font-weight: 500;
 }

 input[type="text"],
 input[type="email"],
 input[type="password"] {
 width: 100%;
 padding: 12px 15px;
 border: 2px solid #ddd;
 border-radius: 8px;
 font-size: 1rem;
 transition: all 0.3s ease;
 }

 input:focus {
 outline: none;
 border-color: #2d8659;
 box-shadow: 0 0 0 3px rgba(45, 134, 89, 0.1);
 }

 .btn {
 width: 100%;
 padding: 14px;
 background: linear-gradient(135deg, #c6a66a, #9f7b3f);
 color: #ffffff;
 border: none;
 border-radius: 8px;
 font-size: 1.1rem;
 font-weight: 600;
 cursor: pointer;
 transition: transform 0.2s ease, box-shadow 0.2s ease;
 }

 .btn:hover {
 background: linear-gradient(135deg, #9f7b3f, #86642f);
 color: #ffffff;
 transform: translateY(-2px);
 box-shadow: 0 5px 15px rgba(198, 166, 106, 0.3);
 }

 .btn:active {
 transform: translateY(0);
 }

 .links {
 margin-top: 1.5rem;
 text-align: center;
 }

 .links a {
 color: #2d8659;
 text-decoration: none;
 font-weight: 500;
 transition: color 0.2s ease;
 }

 .links a:hover {
 color: #1a5f3f;
 text-decoration: underline;
 }

 .error {
 background-color: #fee;
 color: #c33;
 padding: 12px;
 border-radius: 8px;
 margin-bottom: 1rem;
 border-left: 4px solid #c33;
 }

 .success {
 background-color: #efe;
 color: #3c3;
 padding: 12px;
 border-radius: 8px;
 margin-bottom: 1rem;
 border-left: 4px solid #3c3;
 }

 .helper-text {
 font-size: 0.875rem;
 color: #666;
 margin-top: 0.5rem;
 }

 /* Luxury auth theme */
 body {
 background:
 radial-gradient(circle at 20% 12%, rgba(214, 184, 115, 0.14), transparent 30%),
 linear-gradient(135deg, #070706 0%, #12110f 54%, #080807 100%);
 color: #f4efe4;
 }

 .jungle-bg {
 display: none;
 }

 .container {
 background: linear-gradient(135deg, rgba(255,255,255,0.075), rgba(255,255,255,0.032));
 border: 1px solid rgba(225, 204, 153, 0.18);
 border-radius: 8px;
 box-shadow: 0 28px 72px rgba(0, 0, 0, 0.48);
 backdrop-filter: blur(18px);
 -webkit-backdrop-filter: blur(18px);
 }

 .logo h1,
 label {
 color: #fff7e8;
 }

 .logo p,
 .helper-text,
 .links {
 color: #b9ad9a;
 }

 input[type="text"],
 input[type="email"],
 input[type="password"] {
 background: rgba(255,255,255,0.055);
 border: 1px solid rgba(225, 204, 153, 0.18);
 color: #fff7e8;
 border-radius: 8px;
 }

 input:focus {
 border-color: rgba(214, 184, 115, 0.7);
 box-shadow: 0 0 0 3px rgba(201, 169, 104, 0.12);
 }

 .btn {
 background: linear-gradient(135deg, #d6b873, #a87d38);
 color: #14110b;
 border: 1px solid rgba(255, 239, 202, 0.32);
 border-radius: 8px;
 box-shadow: 0 14px 34px rgba(168, 125, 56, 0.24);
 }

 .btn:hover {
 background: linear-gradient(135deg, #e2c982, #b78b44);
 color: #14110b;
 box-shadow: 0 18px 42px rgba(168, 125, 56, 0.32);
 }

 .links a {
 color: #d6b873;
 }

 .links a:hover {
 color: #ffe4a8;
 }
 </style>
</head>
<body>
 <div class="jungle-bg">
 <div class="leaf" style="top: 10%; left: 10%; animation-delay: 0s;"></div>
 <div class="leaf" style="top: 60%; left: 80%; animation-delay: 2s;"></div>
 <div class="leaf" style="top: 80%; left: 20%; animation-delay: 4s;"></div>
 </div>

 <div class="container">
 <div class="logo">
 <h1> AI Team</h1>
 <p>Welcome back!</p>
 </div>

 <div id="message"></div>

 <form id="loginForm">
 <div class="form-group">
 <label for="email">Username or Email</label>
 <input 
 type="text" 
 id="email" 
 name="email" 
 placeholder="Enter your username or email"
 required
 autocomplete="username"
 >
 <div class="helper-text">You can use either your username or email address</div>
 </div>

 <div class="form-group">
 <label for="password">Password</label>
 <input 
 type="password" 
 id="password" 
 name="password" 
 placeholder="Enter your password"
 required
 autocomplete="current-password"
 >
 </div>

 <button type="submit" class="btn">Login</button>
 </form>

 <div class="links">
 <p>Don't have an account? <a href="/signup">Sign up here</a></p>
 <p style="margin-top: 0.5rem;"><a href="/"> Back to home</a></p>
 </div>
 </div>

 <script>
 document.getElementById('loginForm').addEventListener('submit', async (e) => {
 e.preventDefault();
 
 const usernameOrEmail = document.getElementById('email').value;
 const password = document.getElementById('password').value;
 const messageDiv = document.getElementById('message');
 
 try {
 const response = await fetch('/api/login', {
 method: 'POST',
 headers: {
 'Content-Type': 'application/json',
 },
 body: JSON.stringify({
 email: usernameOrEmail, // Backend accepts this as username OR email
 password: password
 })
 });
 
 const data = await response.json();
 
 if (response.ok) {
 messageDiv.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
 setTimeout(() => {
 window.location.href = '/dashboard';
 }, 1000);
 } else {
 messageDiv.innerHTML = `<div class="error">${data.error}</div>`;
 }
 } catch (error) {
 messageDiv.innerHTML = '<div class="error">Connection error. Please try again.</div>';
 }
 });
 </script>
</body>
</html>
