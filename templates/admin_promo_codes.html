<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Promo Codes</title>

    <!-- Premium Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='premium-design.css') }}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        h1 {
            color: #10a37f;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 1em;
        }

        button {
            padding: 12px 30px;
            background: #10a37f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #0d8c6f;
            transform: translateY(-2px);
        }

        .codes-display {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .code-item {
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-text {
            font-family: monospace;
            font-size: 1.2em;
            font-weight: 700;
            color: #10a37f;
        }

        .code-tier {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .code-status {
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .success {
            color: #10a37f;
            font-weight: 600;
            margin-top: 10px;
        }

        .error {
            color: #e74c3c;
            font-weight: 600;
            margin-top: 10px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #10a37f;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }

        th {
            background: #10a37f;
            color: white;
            font-weight: 600;
        }

        .used {
            color: #e74c3c;
        }

        .available {
            color: #10a37f;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
        
        <h1>🎟️ Promo Code Management</h1>

        <!-- Generate Codes Section -->
        <div class="section">
            <h2>Generate New Promo Codes</h2>
            
            <div class="form-group">
                <label>Promo Code Type:</label>
                <select id="discountType" onchange="toggleDiscountFields()">
                    <option value="tier">Tier Upgrade</option>
                    <option value="trial">Free Trial</option>
                    <option value="amount">Dollar Amount Discount</option>
                    <option value="percent">Percentage Discount</option>
                </select>
            </div>

            <div class="form-group" id="tierGroup">
                <label>Tier:</label>
                <select id="tier">
                    <option value="freeforlife">Free For Life (Unlimited)</option>
                    <option value="starter">Starter (100 msgs/day)</option>
                    <option value="pro">Pro (500 msgs/day)</option>
                </select>
            </div>

            <div class="form-group" id="trialGroup" style="display: none;">
                <label>Trial Duration:</label>
                <select id="trialDuration">
                    <option value="7">1 Week (7 days)</option>
                    <option value="14">2 Weeks (14 days)</option>
                    <option value="21">3 Weeks (21 days)</option>
                    <option value="30">1 Month (30 days)</option>
                    <option value="60">2 Months (60 days)</option>
                </select>
            </div>

            <div class="form-group" id="discountValueGroup" style="display: none;">
                <label id="discountValueLabel">Discount Amount ($):</label>
                <input type="number" id="discountValue" placeholder="e.g., 10" min="0" step="0.01">
                <small style="color: #7f8c8d; display: block; margin-top: 5px;">
                    Amount: Enter dollars (e.g., 10 for $10 off) | Percent: Enter number (e.g., 20 for 20% off)
                </small>
            </div>

            <div class="form-group">
                <label>Number of Codes:</label>
                <input type="number" id="count" value="10" min="1" max="100">
            </div>

            <div class="form-group">
                <label>Usage Limit:</label>
                <select id="maxUses">
                    <option value="-1">Unlimited Uses</option>
                    <option value="0">Single Use (One Time Only)</option>
                    <option value="5">5 Uses</option>
                    <option value="10">10 Uses</option>
                    <option value="25">25 Uses</option>
                    <option value="50">50 Uses</option>
                    <option value="100">100 Uses</option>
                    <option value="custom">Custom Amount...</option>
                </select>
            </div>

            <div class="form-group" id="customMaxUsesGroup" style="display: none;">
                <label>Custom Usage Limit:</label>
                <input type="number" id="customMaxUses" placeholder="Enter number of uses" min="1">
            </div>

            <div class="form-group">
                <label>Prefix (optional):</label>
                <input type="text" id="prefix" placeholder="e.g., LAUNCH-">
            </div>

            <button onclick="generateCodes()">Generate Codes</button>

            <div id="generateMessage"></div>

            <div id="generatedCodes" class="codes-display" style="display: none;">
                <h3>Generated Codes:</h3>
                <div id="codesList"></div>
                <button onclick="copyAllCodes()" style="margin-top: 15px;">📋 Copy All</button>
            </div>
        </div>

        <!-- View Existing Codes Section -->
        <div class="section">
            <h2>Existing Promo Codes</h2>
            <button onclick="loadPromos()">🔄 Refresh List</button>
            
            <div id="promoList">
                <p style="color: #7f8c8d; margin-top: 20px;">Click "Refresh List" to load promo codes</p>
            </div>
        </div>
    </div>

    <script>
        let generatedCodesArray = [];

        function toggleDiscountFields() {
            const discountType = document.getElementById('discountType').value;
            const tierGroup = document.getElementById('tierGroup');
            const trialGroup = document.getElementById('trialGroup');
            const discountValueGroup = document.getElementById('discountValueGroup');
            const discountValueLabel = document.getElementById('discountValueLabel');

            // Hide all groups first
            tierGroup.style.display = 'none';
            trialGroup.style.display = 'none';
            discountValueGroup.style.display = 'none';

            // Show appropriate group based on type
            if (discountType === 'tier') {
                tierGroup.style.display = 'block';
            } else if (discountType === 'trial') {
                trialGroup.style.display = 'block';
            } else {
                discountValueGroup.style.display = 'block';

                if (discountType === 'amount') {
                    discountValueLabel.textContent = 'Discount Amount ($):';
                } else if (discountType === 'percent') {
                    discountValueLabel.textContent = 'Discount Percentage (%):';
                }
            }
        }

        // Toggle custom max uses input
        document.addEventListener('DOMContentLoaded', function() {
            const maxUsesSelect = document.getElementById('maxUses');
            const customMaxUsesGroup = document.getElementById('customMaxUsesGroup');

            maxUsesSelect.addEventListener('change', function() {
                if (this.value === 'custom') {
                    customMaxUsesGroup.style.display = 'block';
                } else {
                    customMaxUsesGroup.style.display = 'none';
                }
            });
        });

        async function generateCodes() {
            const discountType = document.getElementById('discountType').value;
            const tier = document.getElementById('tier').value;
            const count = parseInt(document.getElementById('count').value);
            const prefix = document.getElementById('prefix').value.trim();
            const discountValue = parseFloat(document.getElementById('discountValue').value);
            const trialDuration = parseInt(document.getElementById('trialDuration').value);
            const maxUsesSelect = document.getElementById('maxUses').value;
            const customMaxUses = parseInt(document.getElementById('customMaxUses').value);
            const messageDiv = document.getElementById('generateMessage');

            // Determine max_uses value
            let maxUses = -1; // Default to unlimited
            if (maxUsesSelect === 'custom') {
                if (!customMaxUses || customMaxUses < 1) {
                    messageDiv.innerHTML = '<p class="error">❌ Please enter a valid custom usage limit (must be at least 1)</p>';
                    return;
                }
                maxUses = customMaxUses;
            } else {
                maxUses = parseInt(maxUsesSelect);
            }

            if (count < 1 || count > 100) {
                messageDiv.innerHTML = '<p class="error">❌ Please enter between 1 and 100 codes</p>';
                return;
            }

            // Validate discount value for amount/percent types
            if (discountType === 'amount' || discountType === 'percent') {
                if (!discountValue || discountValue <= 0) {
                    messageDiv.innerHTML = '<p class="error">❌ Please enter a valid discount value</p>';
                    return;
                }
                if (discountType === 'percent' && discountValue > 100) {
                    messageDiv.innerHTML = '<p class="error">❌ Percentage discount cannot exceed 100%</p>';
                    return;
                }
            }

            messageDiv.innerHTML = '<p style="color: #7f8c8d;">⏳ Generating codes...</p>';

            try {
                const requestBody = {
                    tier,
                    count,
                    prefix,
                    discount_type: discountType,
                    discount_value: (discountType === 'amount' || discountType === 'percent') ? discountValue : null,
                    trial_days: discountType === 'trial' ? trialDuration : null,
                    max_uses: maxUses
                };

                const response = await fetch('/api/admin/generate-promo-codes', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    generatedCodesArray = data.codes;

                    let discountLabel = '';
                    if (discountType === 'tier') {
                        discountLabel = tier.toUpperCase();
                    } else if (discountType === 'trial') {
                        const days = trialDuration;
                        if (days === 7) discountLabel = '1 WEEK FREE';
                        else if (days === 14) discountLabel = '2 WEEKS FREE';
                        else if (days === 21) discountLabel = '3 WEEKS FREE';
                        else if (days === 30) discountLabel = '1 MONTH FREE';
                        else if (days === 60) discountLabel = '2 MONTHS FREE';
                        else discountLabel = `${days} DAYS FREE`;
                    } else if (discountType === 'amount') {
                        discountLabel = `$${discountValue} OFF`;
                    } else if (discountType === 'percent') {
                        discountLabel = `${discountValue}% OFF`;
                    }

                    // Determine usage limit label
                    let usageLabel = maxUses === -1 ? '∞ Unlimited' :
                                   maxUses === 0 ? '🔒 Single Use' :
                                   `${maxUses} Uses`;

                    messageDiv.innerHTML = `<p class="success">✅ Generated ${data.count} codes! (${usageLabel})</p>`;

                    // Display codes
                    const codesDisplay = document.getElementById('generatedCodes');
                    const codesList = document.getElementById('codesList');

                    codesList.innerHTML = data.codes.map(code => `
                        <div class="code-item">
                            <span class="code-text">${code}</span>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <span class="code-tier">${discountLabel}</span>
                                <span style="font-size: 0.85em; color: #7f8c8d; padding: 4px 8px; background: #ecf0f1; border-radius: 12px;">${usageLabel}</span>
                            </div>
                        </div>
                    `).join('');

                    codesDisplay.style.display = 'block';
                } else {
                    messageDiv.innerHTML = `<p class="error">❌ ${data.error}</p>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<p class="error">❌ Error generating codes</p>';
            }
        }

        function copyAllCodes() {
            const codesText = generatedCodesArray.join('\n');
            navigator.clipboard.writeText(codesText).then(() => {
                alert('✅ All codes copied to clipboard!');
            });
        }

        async function loadPromos() {
            const promoList = document.getElementById('promoList');
            promoList.innerHTML = '<p style="color: #7f8c8d;">⏳ Loading...</p>';

            try {
                const response = await fetch('/api/admin/list-promo-codes', {
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok && data.codes.length > 0) {
                    promoList.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Type</th>
                                    <th>Discount/Tier</th>
                                    <th>Usage Limit</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.codes.map(code => {
                                    // Determine discount label
                                    let discountLabel = '';
                                    let discountType = code.discount_type || 'tier';

                                    if (discountType === 'tier') {
                                        discountLabel = code.tier.toUpperCase();
                                    } else if (discountType === 'trial' && code.trial_days) {
                                        discountLabel = `${code.trial_days} Days Free`;
                                    } else if (discountType === 'amount' && code.discount_value) {
                                        discountLabel = `$${code.discount_value} OFF`;
                                    } else if (discountType === 'percent' && code.discount_value) {
                                        discountLabel = `${code.discount_value}% OFF`;
                                    } else {
                                        discountLabel = code.tier.toUpperCase();
                                    }

                                    // Determine usage display
                                    let usageDisplay = code.max_uses === -1 ?
                                        `${code.times_used} / ∞` :
                                        `${code.times_used} / ${code.max_uses}`;

                                    // Determine if fully used
                                    let isUsed = code.max_uses !== -1 && code.times_used >= code.max_uses;

                                    return `
                                        <tr>
                                            <td><span class="code-text">${code.code}</span></td>
                                            <td><span style="font-size: 0.85em; color: #7f8c8d;">${discountType.charAt(0).toUpperCase() + discountType.slice(1)}</span></td>
                                            <td><span class="code-tier">${discountLabel}</span></td>
                                            <td>${usageDisplay}</td>
                                            <td class="${isUsed ? 'used' : 'available'}">
                                                ${isUsed ? '🔴 Used Up' : '🟢 Available'}
                                            </td>
                                            <td>${new Date(code.created_at).toLocaleDateString()}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    `;
                } else if (data.codes.length === 0) {
                    promoList.innerHTML = '<p style="color: #7f8c8d;">No promo codes yet. Generate some above!</p>';
                } else {
                    promoList.innerHTML = `<p class="error">❌ ${data.error}</p>`;
                }
            } catch (error) {
                promoList.innerHTML = '<p class="error">❌ Error loading promo codes</p>';
            }
        }
    </script>
</body>
</html>
