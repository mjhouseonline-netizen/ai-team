<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Promo Codes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        h1 {
            color: #10a37f;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 1em;
        }

        button {
            padding: 12px 30px;
            background: #10a37f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #0d8c6f;
            transform: translateY(-2px);
        }

        .codes-display {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .code-item {
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-text {
            font-family: monospace;
            font-size: 1.2em;
            font-weight: 700;
            color: #10a37f;
        }

        .code-tier {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .code-status {
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .success {
            color: #10a37f;
            font-weight: 600;
            margin-top: 10px;
        }

        .error {
            color: #e74c3c;
            font-weight: 600;
            margin-top: 10px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #10a37f;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }

        th {
            background: #10a37f;
            color: white;
            font-weight: 600;
        }

        .used {
            color: #e74c3c;
        }

        .available {
            color: #10a37f;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
        
        <h1>🎟️ Promo Code Management</h1>

        <!-- Generate Codes Section -->
        <div class="section">
            <h2>Generate New Promo Codes</h2>
            
            <div class="form-group">
                <label>Tier:</label>
                <select id="tier">
                    <option value="freeforlife">Free For Life (Unlimited)</option>
                    <option value="starter">Starter (100 msgs/day)</option>
                    <option value="pro">Pro (500 msgs/day)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Number of Codes:</label>
                <input type="number" id="count" value="10" min="1" max="100">
            </div>

            <div class="form-group">
                <label>Prefix (optional):</label>
                <input type="text" id="prefix" placeholder="e.g., LAUNCH-">
            </div>

            <button onclick="generateCodes()">Generate Codes</button>

            <div id="generateMessage"></div>

            <div id="generatedCodes" class="codes-display" style="display: none;">
                <h3>Generated Codes:</h3>
                <div id="codesList"></div>
                <button onclick="copyAllCodes()" style="margin-top: 15px;">📋 Copy All</button>
            </div>
        </div>

        <!-- View Existing Codes Section -->
        <div class="section">
            <h2>Existing Promo Codes</h2>
            <button onclick="loadPromos()">🔄 Refresh List</button>
            
            <div id="promoList">
                <p style="color: #7f8c8d; margin-top: 20px;">Click "Refresh List" to load promo codes</p>
            </div>
        </div>
    </div>

    <script>
        let generatedCodesArray = [];

        async function generateCodes() {
            const tier = document.getElementById('tier').value;
            const count = parseInt(document.getElementById('count').value);
            const prefix = document.getElementById('prefix').value.trim();
            const messageDiv = document.getElementById('generateMessage');

            if (count < 1 || count > 100) {
                messageDiv.innerHTML = '<p class="error">❌ Please enter between 1 and 100 codes</p>';
                return;
            }

            messageDiv.innerHTML = '<p style="color: #7f8c8d;">⏳ Generating codes...</p>';

            try {
                const response = await fetch('/api/admin/generate-promo-codes', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({ tier, count, prefix })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    generatedCodesArray = data.codes;
                    messageDiv.innerHTML = `<p class="success">✅ Generated ${data.count} codes!</p>`;
                    
                    // Display codes
                    const codesDisplay = document.getElementById('generatedCodes');
                    const codesList = document.getElementById('codesList');
                    
                    codesList.innerHTML = data.codes.map(code => `
                        <div class="code-item">
                            <span class="code-text">${code}</span>
                            <span class="code-tier">${tier.toUpperCase()}</span>
                        </div>
                    `).join('');
                    
                    codesDisplay.style.display = 'block';
                } else {
                    messageDiv.innerHTML = `<p class="error">❌ ${data.error}</p>`;
                }
            } catch (error) {
                messageDiv.innerHTML = '<p class="error">❌ Error generating codes</p>';
            }
        }

        function copyAllCodes() {
            const codesText = generatedCodesArray.join('\n');
            navigator.clipboard.writeText(codesText).then(() => {
                alert('✅ All codes copied to clipboard!');
            });
        }

        async function loadPromos() {
            const promoList = document.getElementById('promoList');
            promoList.innerHTML = '<p style="color: #7f8c8d;">⏳ Loading...</p>';

            try {
                const response = await fetch('/api/admin/list-promo-codes', {
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok && data.codes.length > 0) {
                    promoList.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Tier</th>
                                    <th>Usage</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.codes.map(code => `
                                    <tr>
                                        <td><span class="code-text">${code.code}</span></td>
                                        <td><span class="code-tier">${code.tier.toUpperCase()}</span></td>
                                        <td>${code.times_used} / ${code.max_uses}</td>
                                        <td class="${code.times_used >= code.max_uses ? 'used' : 'available'}">
                                            ${code.times_used >= code.max_uses ? '🔴 Used' : '🟢 Available'}
                                        </td>
                                        <td>${new Date(code.created_at).toLocaleDateString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else if (data.codes.length === 0) {
                    promoList.innerHTML = '<p style="color: #7f8c8d;">No promo codes yet. Generate some above!</p>';
                } else {
                    promoList.innerHTML = `<p class="error">❌ ${data.error}</p>`;
                }
            } catch (error) {
                promoList.innerHTML = '<p class="error">❌ Error loading promo codes</p>';
            }
        }
    </script>
</body>
</html>
