<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AI Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            padding: 20px;
            color: #374151;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #10a37f !important;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #0d8c6f !important;
            transform: translateY(-2px);
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #10a37f;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #10a37f;
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10a37f;
        }

        .btn {
            padding: 12px 24px;
            background: #10a37f !important;
            color: white !important;
            border: none !important;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
        }

        .btn:hover {
            background: #0d8c6f !important;
            transform: translateY(-2px);
        }

        .subscription-card {
            background: linear-gradient(135deg, #10a37f 0%, #0d8c6f 100%);
            padding: 25px;
            border-radius: 12px;
            color: white;
            margin-bottom: 20px;
        }

        .subscription-card .tier {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .upgrade-btn {
            background: white !important;
            color: #10a37f !important;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .promo-input {
            display: flex;
            gap: 10px;
        }

        .promo-input input {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="back-btn">← Back to Dashboard</a>

        <div class="header">
            <h1>⚙️ Settings</h1>
            <p>Manage your account and preferences</p>
        </div>

        <div class="section">
            <h2>💳 Subscription</h2>
            <div class="subscription-card">
                <div class="tier">{{ current_user.subscription_tier|upper }}</div>
                <p>Current Plan</p>
                <a href="/pricing" class="upgrade-btn">View All Plans</a>
            </div>
            
            <h3>🎟️ Promo Code</h3>
            <div class="promo-input">
                <input type="text" id="promoCode" placeholder="Enter code">
                <button class="btn" onclick="redeemPromo()">Redeem</button>
            </div>
        </div>

        <div class="section">
            <h2>👤 Account</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" value="{{ current_user.email }}" readonly style="background: #f9fafb;">
            </div>
        </div>
    </div>

    <script>
        function redeemPromo() {
            const code = document.getElementById('promoCode').value.trim();
            if (!code) {
                alert('Please enter a promo code');
                return;
            }

            fetch('/api/redeem-promo-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    window.location.href = '/dashboard';
                } else {
                    alert(data.error || 'Invalid promo code');
                }
            });
        }
    </script>
</body>
</html>
