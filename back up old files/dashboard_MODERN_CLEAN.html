<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Team - Modern Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10a37f;
            --primary-hover: #0d8c6f;
            --bg-main: #ffffff;
            --bg-secondary: #f7f7f8;
            --bg-user: #f7f7f8;
            --bg-assistant: #ffffff;
            --text-primary: #2d333a;
            --text-secondary: #6e6e80;
            --border: #e5e5e5;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: var(--bg-main);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 1px 3px var(--shadow);
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .usage-badge {
            background: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0;
            min-height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
        }

        /* Agent Selector */
        .agent-selector {
            padding: 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        .agent-btn {
            background: white;
            border: 2px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .agent-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .agent-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Model Selector */
        .model-selector-container {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .model-select {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            min-width: 280px;
            transition: all 0.2s;
        }

        .model-select:hover {
            border-color: var(--primary);
        }

        .model-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .welcome h2 {
            font-size: 28px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 16px;
        }

        /* Messages */
        .message-group {
            margin-bottom: 24px;
        }

        .message {
            display: flex;
            gap: 16px;
            padding: 16px 0;
        }

        .message.user {
            background: var(--bg-user);
            margin: 0 -20px;
            padding: 20px;
        }

        .message.assistant {
            background: var(--bg-assistant);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #5436da;
        }

        .message-content {
            flex: 1;
            font-size: 15px;
            line-height: 1.7;
            max-width: 100%;
        }

        .model-badge {
            display: inline-block;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: 500;
        }

        /* Input Area */
        .input-container {
            position: sticky;
            bottom: 0;
            background: var(--bg-main);
            border-top: 1px solid var(--border);
            padding: 16px 20px 20px;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .input-area {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .input-area:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1);
        }

        .input-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .input-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        #messageInput {
            flex: 1;
            border: none;
            background: none;
            font-size: 15px;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 200px;
            overflow-y: auto;
            font-family: inherit;
            line-height: 1.5;
        }

        #messageInput::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .logo {
                font-size: 18px;
            }

            .header-right {
                font-size: 12px;
                gap: 8px;
            }

            .usage-badge {
                padding: 4px 10px;
                font-size: 12px;
            }

            .agent-selector {
                padding: 16px;
            }

            .agent-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .agent-btn {
                padding: 10px 12px;
                font-size: 13px;
            }

            .model-selector-container {
                padding: 12px 16px;
            }

            .model-select {
                min-width: 100%;
                font-size: 13px;
                padding: 8px 12px;
            }

            .chat-container {
                padding: 16px;
            }

            .welcome {
                padding: 40px 16px;
            }

            .welcome h2 {
                font-size: 24px;
            }

            .welcome p {
                font-size: 14px;
            }

            .message {
                gap: 12px;
                font-size: 14px;
            }

            .message.user {
                margin: 0 -16px;
                padding: 16px;
            }

            .avatar {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }

            .message-content {
                font-size: 14px;
            }

            .input-container {
                padding: 12px 16px 16px;
            }

            .input-area {
                padding: 10px 12px;
            }

            #messageInput {
                font-size: 14px;
            }

            .send-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .agent-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header-right {
                flex-direction: column;
                align-items: flex-end;
                gap: 4px;
            }
        }

        /* Loading Animation */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            🌿 AI Team
        </div>
        <div class="header-right">
            <div class="usage-badge">
                <span id="messages-used">0</span>/<span id="daily-limit">25</span> messages
            </div>
            <a href="/pricing" style="color: var(--primary); text-decoration: none; font-weight: 500;">Upgrade</a>
        </div>
    </div>

    <!-- Agent Selector -->
    <div class="agent-selector">
        <div class="agent-grid">
            <button class="agent-btn active" onclick="selectAgent('Luna')">🌙 Luna</button>
            <button class="agent-btn" onclick="selectAgent('Mila')">📋 Mila</button>
            <button class="agent-btn" onclick="selectAgent('Sage')">📝 Sage</button>
            <button class="agent-btn" onclick="selectAgent('Ember')">🎨 Ember</button>
            <button class="agent-btn" onclick="selectAgent('Sol')">☀️ Sol</button>
            <button class="agent-btn" onclick="selectAgent('Nova')">💻 Nova</button>
            <button class="agent-btn" onclick="selectAgent('Theo')">⚡ Theo</button>
        </div>
    </div>

    <!-- Model Selector -->
    <div class="model-selector-container">
        <label for="modelSelect" style="font-size: 14px; color: var(--text-secondary); font-weight: 500;">
            Model:
        </label>
        <select id="modelSelect" class="model-select">
            <optgroup label="Claude">
                <option value="claude-sonnet-4.5" selected>Sonnet 4.5 - Fast & Smart</option>
                <option value="claude-opus-4">Opus 4 - Most Capable</option>
                <option value="claude-haiku-4.5">Haiku 4.5 - Ultra Fast</option>
            </optgroup>
            <optgroup label="GPT">
                <option value="gpt-4o">GPT-4o - Latest</option>
                <option value="gpt-4-turbo">GPT-4 Turbo</option>
                <option value="gpt-4o-mini">GPT-4o Mini - Cheapest</option>
            </optgroup>
            <optgroup label="Gemini">
                <option value="gemini-2.0-flash">Gemini 2.0 - FREE</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
            </optgroup>
        </select>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome">
                <h2>Hi! I'm Luna 🌙</h2>
                <p>I'm your data analyst. How can I help you today?</p>
            </div>
        </div>

        <!-- Input Container -->
        <div class="input-container">
            <div class="input-wrapper">
                <div class="input-area">
                    <button class="input-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">
                        📎
                    </button>
                    <button class="input-btn" onclick="toggleImageMode()" title="Generate image">
                        🎨
                    </button>
                    <textarea 
                        id="messageInput" 
                        placeholder="Message Luna..." 
                        rows="1"
                        onkeydown="handleKeyPress(event)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" style="display: none;" accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.md,.csv">

    <script>
        let currentAgent = 'Luna';
        let imageMode = false;
        let uploadedFile = null;

        // Agent emojis
        const agentEmojis = {
            'Luna': '🌙',
            'Mila': '📋',
            'Sage': '📝',
            'Ember': '🎨',
            'Sol': '☀️',
            'Nova': '💻',
            'Theo': '⚡'
        };

        // Select agent
        function selectAgent(agent) {
            currentAgent = agent;
            
            // Update active button
            document.querySelectorAll('.agent-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(agent)) {
                    btn.classList.add('active');
                }
            });
            
            // Update placeholder
            document.getElementById('messageInput').placeholder = `Message ${agent}...`;
            
            // Update welcome message
            const welcome = document.querySelector('.welcome');
            if (welcome) {
                welcome.innerHTML = `
                    <h2>Hi! I'm ${agent} ${agentEmojis[agent]}</h2>
                    <p>How can I help you today?</p>
                `;
            }
        }

        // Handle key press
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Toggle image mode
        function toggleImageMode() {
            imageMode = !imageMode;
            const input = document.getElementById('messageInput');
            if (imageMode) {
                input.placeholder = '🎨 Describe the image you want...';
            } else {
                input.placeholder = `Message ${currentAgent}...`;
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            
            // Add user message
            addMessage(message, 'user');
            input.value = '';
            
            // Show typing indicator
            const typingId = showTyping();
            
            try {
                const selectedModel = document.getElementById('modelSelect').value;
                
                let endpoint = '/api/chat';
                let requestBody = {
                    message: message,
                    agent: currentAgent,
                    model: selectedModel
                };
                
                if (imageMode) {
                    endpoint = '/api/generate-image-free';
                    requestBody = {
                        prompt: message,
                        agent: currentAgent
                    };
                }
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                // Remove typing indicator
                removeTyping(typingId);
                
                if (response.ok) {
                    if (imageMode && data.image_url) {
                        addMessage(`Here's your image!`, 'assistant', data.image_url);
                    } else {
                        const modelBadge = data.model_used ? getModelName(data.model_used) : '';
                        addMessage(data.response, 'assistant', null, modelBadge);
                    }
                    loadStats();
                } else {
                    addMessage(`Error: ${data.error || 'Failed to get response'}`, 'assistant');
                }
            } catch (error) {
                removeTyping(typingId);
                addMessage('Error: Failed to connect to server', 'assistant');
            }
            
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
            
            if (imageMode) {
                toggleImageMode();
            }
        }

        // Add message to chat
        function addMessage(text, type, imageUrl = null, modelBadge = '') {
            const container = document.getElementById('chatContainer');
            const welcome = container.querySelector('.welcome');
            if (welcome) welcome.remove();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = type === 'user' ? '👤' : agentEmojis[currentAgent];
            const badge = modelBadge ? `<span class="model-badge">${modelBadge}</span>` : '';
            
            if (imageUrl) {
                messageDiv.innerHTML = `
                    <div class="avatar">${avatar}</div>
                    <div class="message-content">
                        ${text}${badge}
                        <div style="margin-top: 12px;">
                            <img src="${imageUrl}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" alt="Generated image">
                        </div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="avatar">${avatar}</div>
                    <div class="message-content">${escapeHtml(text)}${badge}</div>
                `;
            }
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Show typing indicator
        function showTyping() {
            const container = document.getElementById('chatContainer');
            const typingDiv = document.createElement('div');
            const id = 'typing-' + Date.now();
            typingDiv.id = id;
            typingDiv.className = 'message assistant';
            typingDiv.innerHTML = `
                <div class="avatar">${agentEmojis[currentAgent]}</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        // Remove typing indicator
        function removeTyping(id) {
            const typing = document.getElementById(id);
            if (typing) typing.remove();
        }

        // Get model name
        function getModelName(modelKey) {
            const models = {
                'claude-sonnet-4.5': 'Sonnet 4.5',
                'claude-opus-4': 'Opus 4',
                'claude-haiku-4.5': 'Haiku 4.5',
                'gpt-4o': 'GPT-4o',
                'gpt-4-turbo': 'GPT-4 Turbo',
                'gpt-4o-mini': 'GPT-4o Mini',
                'gemini-2.0-flash': 'Gemini 2.0',
                'gemini-1.5-pro': 'Gemini 1.5 Pro'
            };
            return models[modelKey] || modelKey;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch('/api/stats', {
                    credentials: 'include'
                });
                const data = await response.json();
                
                document.getElementById('messages-used').textContent = data.messages_today || 0;
                document.getElementById('daily-limit').textContent = data.daily_limit || 25;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Initialize
        loadStats();
        setInterval(loadStats, 30000); // Refresh every 30 seconds
    </script>
</body>
</html>
