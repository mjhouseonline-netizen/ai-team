<!-- settings.html -->
<!-- Add this Notion section to your settings page -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AI Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .settings-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .integration-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .integration-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .integration-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .integration-icon {
            width: 48px;
            height: 48px;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .integration-details h3 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 5px;
        }

        .integration-details p {
            font-size: 0.9rem;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .status-connected {
            background: #10b981;
            color: white;
        }

        .status-disconnected {
            background: #ef4444;
            color: white;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .workspace-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .workspace-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .workspace-name {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Dashboard</a>
        
        <div class="header">
            <h1>⚙️ Settings</h1>
            <p>Manage your integrations and preferences</p>
        </div>

        <!-- Success/Error Messages -->
        <div id="messages"></div>

        <!-- Notion Integration Section -->
        <div class="settings-card">
            <h2 class="section-title">📚 Integrations</h2>
            
            <div class="integration-item">
                <div class="integration-info">
                    <div class="integration-icon" style="background: #000;">
                        N
                    </div>
                    <div class="integration-details">
                        <h3>Notion</h3>
                        <p>Connect your Notion workspace to let your AI agents access your notes, docs, and databases</p>
                        <span class="status-badge" id="notion-status">
                            <span class="status-disconnected">Not Connected</span>
                        </span>
                        <div id="workspace-info" class="workspace-info" style="display: none;">
                            <img id="workspace-icon" class="workspace-icon" src="" alt="">
                            <span id="workspace-name" class="workspace-name"></span>
                        </div>
                    </div>
                </div>
                <div id="notion-actions">
                    <a href="/api/integrations/notion/connect" class="btn btn-primary">
                        Connect Notion
                    </a>
                </div>
            </div>
        </div>

        <!-- Other Settings Sections -->
        <div class="settings-card">
            <h2 class="section-title">👤 Account</h2>
            <div class="integration-item">
                <div class="integration-info">
                    <div class="integration-details">
                        <h3>Profile Information</h3>
                        <p>Manage your account details</p>
                    </div>
                </div>
                <button class="btn btn-secondary">Edit Profile</button>
            </div>
        </div>
    </div>

    <script>
        // Check Notion connection status on page load
        async function checkNotionStatus() {
            try {
                const response = await fetch('/api/integrations/notion/status');
                const data = await response.json();
                
                const statusBadge = document.getElementById('notion-status');
                const actionsDiv = document.getElementById('notion-actions');
                const workspaceInfo = document.getElementById('workspace-info');
                
                if (data.connected) {
                    statusBadge.innerHTML = '<span class="status-connected">✓ Connected</span>';
                    actionsDiv.innerHTML = `
                        <button onclick="disconnectNotion()" class="btn btn-danger">
                            Disconnect
                        </button>
                    `;
                    
                    // Show workspace info
                    if (data.integration.workspace_name) {
                        workspaceInfo.style.display = 'flex';
                        document.getElementById('workspace-name').textContent = data.integration.workspace_name;
                        
                        if (data.integration.workspace_icon) {
                            document.getElementById('workspace-icon').src = data.integration.workspace_icon;
                        }
                    }
                }
            } catch (error) {
                console.error('Error checking Notion status:', error);
            }
        }

        async function disconnectNotion() {
            if (!confirm('Are you sure you want to disconnect Notion?')) {
                return;
            }
            
            try {
                const response = await fetch('/api/integrations/notion/disconnect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Notion disconnected successfully', 'success');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showMessage('Error disconnecting Notion: ' + data.error, 'error');
                }
            } catch (error) {
                showMessage('Error disconnecting Notion: ' + error, 'error');
            }
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            messagesDiv.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            
            setTimeout(() => {
                messagesDiv.innerHTML = '';
            }, 5000);
        }

        // Check for OAuth callback messages in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('notion_success')) {
            showMessage('✅ Notion connected successfully!', 'success');
            // Remove query params from URL
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (urlParams.get('notion_error')) {
            const error = urlParams.get('notion_error');
            showMessage('❌ Error connecting Notion: ' + error, 'error');
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Check status on page load
        checkNotionStatus();
    </script>
</body>
</html>
