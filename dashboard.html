<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 AI Team - Rainforest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(180deg, #a8e6cf 0%, #56ab91 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Rainforest Background */
        .rainforest-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(180deg, rgba(168, 230, 207, 0.8) 0%, rgba(86, 171, 145, 0.9) 100%),
                radial-gradient(ellipse at top left, rgba(76, 209, 55, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at top right, rgba(129, 199, 132, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(76, 175, 80, 0.3) 0%, transparent 50%);
            z-index: -1;
        }

        /* Palm leaves decoration */
        .palm-leaf {
            position: fixed;
            pointer-events: none;
        }

        .palm-leaf-left {
            left: 0;
            top: 0;
            width: 300px;
            height: 400px;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            clip-path: polygon(0 0, 80% 0, 50% 100%, 0 80%);
            opacity: 0.6;
            transform-origin: top left;
            animation: swayLeft 15s ease-in-out infinite;
        }

        .palm-leaf-right {
            right: 0;
            top: 0;
            width: 300px;
            height: 400px;
            background: linear-gradient(225deg, #66bb6a 0%, #388e3c 100%);
            clip-path: polygon(20% 0, 100% 0, 100% 80%, 50% 100%);
            opacity: 0.6;
            transform-origin: top right;
            animation: swayRight 15s ease-in-out infinite;
        }

        .palm-leaf-bottom-left {
            left: 0;
            bottom: 0;
            width: 250px;
            height: 300px;
            background: linear-gradient(45deg, #81c784 0%, #4caf50 100%);
            clip-path: polygon(0 100%, 0 20%, 50% 0, 80% 100%);
            opacity: 0.5;
            transform-origin: bottom left;
            animation: swayLeft 18s ease-in-out infinite;
        }

        .palm-leaf-bottom-right {
            right: 0;
            bottom: 0;
            width: 250px;
            height: 300px;
            background: linear-gradient(315deg, #a5d6a7 0%, #66bb6a 100%);
            clip-path: polygon(20% 100%, 50% 0, 100% 20%, 100% 100%);
            opacity: 0.5;
            transform-origin: bottom right;
            animation: swayRight 18s ease-in-out infinite;
        }

        @keyframes swayLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg); }
        }

        @keyframes swayRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes sway {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(10px) rotate(0.5deg); }
        }

        /* Floating leaves */
        .leaf {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #4caf50;
            opacity: 0.4;
            border-radius: 0 100% 0 100%;
            animation: float 15s infinite ease-in-out;
        }

        .leaf:nth-child(1) { left: 10%; animation-delay: 0s; }
        .leaf:nth-child(2) { left: 30%; animation-delay: 3s; }
        .leaf:nth-child(3) { left: 50%; animation-delay: 6s; }
        .leaf:nth-child(4) { left: 70%; animation-delay: 9s; }
        .leaf:nth-child(5) { left: 90%; animation-delay: 12s; }

        @keyframes float {
            0% { top: -50px; transform: rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { top: 100vh; transform: rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 20px;
            border: 3px solid rgba(76, 175, 80, 0.5);
            box-shadow: 0 8px 32px rgba(76, 175, 80, 0.3);
        }

        .logo {
            font-size: 2em;
            color: #2e7d32;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(76, 175, 80, 0.3);
        }

        .user-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .logout-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .logout-btn:hover {
            background: rgba(255, 77, 77, 0.5);
            transform: scale(1.05);
        }

        /* Character Line-up */
        .characters-lineup {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 20px;
            border: 3px solid rgba(76, 175, 80, 0.5);
            box-shadow: 0 8px 32px rgba(76, 175, 80, 0.3);
            min-height: 200px;
            position: relative;
            overflow: visible;
        }

        /* Character Button */
        .character {
            position: relative;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            filter: grayscale(100%) brightness(0.5);
            opacity: 0.6;
        }

        .character img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            transition: all 0.3s;
        }

        .character img.error {
            display: none;
        }

        .character .emoji-fallback {
            display: none;
            font-size: 100px;
            line-height: 100px;
        }

        .character img.error + .emoji-fallback {
            display: block;
        }

        .character-name {
            text-align: center;
            color: #2e7d32;
            font-size: 0.9em;
            margin-top: 5px;
            opacity: 0.7;
            font-weight: 600;
        }

        /* Sleeping character */
        .character.sleeping::after {
            content: 'Zzz';
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 1.5em;
            color: rgba(46, 125, 50, 0.5);
            animation: zzz 2s ease-in-out infinite;
        }

        @keyframes zzz {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.7; transform: translateY(-10px); }
        }

        /* Active/Awake character */
        .character.active {
            filter: grayscale(0%) brightness(1.2);
            opacity: 1;
            transform: scale(1.8) translateY(-30px);
            z-index: 10;
            animation: bounce 2s ease-in-out infinite;
        }

        .character.active img,
        .character.active .emoji-fallback {
            filter: drop-shadow(0 0 30px rgba(76, 175, 80, 0.8));
        }

        .character.active .character-name {
            opacity: 1;
            font-weight: 700;
            font-size: 1.1em;
            color: #1b5e20;
            text-shadow: 0 0 10px rgba(129, 199, 132, 0.8);
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1.8) translateY(-30px); }
            50% { transform: scale(1.8) translateY(-40px); }
        }

        /* Hover effect */
        .character:hover {
            filter: grayscale(50%) brightness(0.8);
            opacity: 0.8;
            transform: scale(1.1);
        }

        .character.active:hover {
            filter: grayscale(0%) brightness(1.2);
            opacity: 1;
        }

        /* Chat Area */
        .chat-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            border: 3px solid rgba(76, 175, 80, 0.5);
            box-shadow: 0 8px 32px rgba(76, 175, 80, 0.3);
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(232, 245, 233, 0.5);
            border-radius: 15px;
            min-height: 300px;
        }

        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 15px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid rgba(102, 126, 234, 0.5);
            margin-left: 20%;
            color: #fff;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .message.agent {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            border: 2px solid rgba(76, 175, 80, 0.5);
            margin-right: 20%;
            color: #fff;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .message-sender {
            font-weight: 700;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.9);
        }

        .message.user .message-sender {
            color: rgba(255, 255, 255, 0.9);
        }

        /* Input Area */
        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(76, 175, 80, 0.5);
            border-radius: 15px;
            color: #2e7d32;
            font-size: 1em;
        }

        .chat-input input::placeholder {
            color: rgba(46, 125, 50, 0.5);
        }

        .chat-input input:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        .send-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(52, 168, 83, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Welcome message */
        .welcome-msg {
            text-align: center;
            color: #2e7d32;
            padding: 40px;
            font-size: 1.2em;
        }

        .welcome-msg strong {
            color: #1b5e20;
            text-shadow: 0 2px 10px rgba(76, 175, 80, 0.3);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(76, 175, 80, 0.3);
            border-radius: 10px;
            color: #2e7d32;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .tab:hover {
            background: rgba(76, 175, 80, 0.2);
            color: #1b5e20;
        }

        .tab.active {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            border-color: #4caf50;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="rainforest-bg"></div>
    <div class="palm-leaf palm-leaf-left"></div>
    <div class="palm-leaf palm-leaf-right"></div>
    <div class="palm-leaf palm-leaf-bottom-left"></div>
    <div class="palm-leaf palm-leaf-bottom-right"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🌴 AI Team</div>
            <div class="user-controls">
                <div style="color: #2e7d32; font-weight: 600;">👤 {{ user.username }}</div>
                <button class="logout-btn" onclick="window.location.href='/logout'">Logout</button>
            </div>
        </div>

        <!-- Character Line-up -->
        <div class="characters-lineup" id="charactersLineup">
            <div class="character sleeping" data-agent="luna" onclick="selectCharacter('luna')">
                <img src="/static/images/luna.jpg" alt="Luna" onerror="this.classList.add('error')">
                <div class="emoji-fallback">🌙</div>
                <div class="character-name">Luna</div>
            </div>
            <div class="character sleeping" data-agent="mila" onclick="selectCharacter('mila')">
                <img src="/static/images/mila.jpg" alt="Mila" onerror="this.classList.add('error')">
                <div class="emoji-fallback">🐉</div>
                <div class="character-name">Mila</div>
            </div>
            <div class="character sleeping" data-agent="sage" onclick="selectCharacter('sage')">
                <img src="/static/images/sage.jpg" alt="Sage" onerror="this.classList.add('error')">
                <div class="emoji-fallback">🦉</div>
                <div class="character-name">Sage</div>
            </div>
            <div class="character active" data-agent="ember" onclick="selectCharacter('ember')">
                <img src="/static/images/ember.jpg" alt="Ember" onerror="this.classList.add('error')">
                <div class="emoji-fallback">🦁</div>
                <div class="character-name">Ember</div>
            </div>
            <div class="character sleeping" data-agent="sol" onclick="selectCharacter('sol')">
                <img src="/static/images/sol.jpg" alt="Sol" onerror="this.classList.add('error')">
                <div class="emoji-fallback">🐤</div>
                <div class="character-name">Sol</div>
            </div>
            <div class="character sleeping" data-agent="nova" onclick="selectCharacter('nova')">
                <img src="/static/images/nova.jpg" alt="Nova" onerror="this.classList.add('error')">
                <div class="emoji-fallback">🌌</div>
                <div class="character-name">Nova</div>
            </div>
            <div class="character sleeping" data-agent="theo" onclick="selectCharacter('theo')">
                <img src="/static/images/theo.jpg" alt="Theo" onerror="this.classList.add('error')">
                <div class="emoji-fallback">🐰</div>
                <div class="character-name">Theo</div>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatTab" class="tab-content active">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-msg">
                        👋 Welcome to the <strong>Rainforest AI Team</strong>!<br>
                        Click on any character above to wake them up and start chatting!
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type your message..." 
                           onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn">Send 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedAgent = 'ember';
        let isProcessing = false;

        // Select character
        function selectCharacter(agent) {
            selectedAgent = agent;
            
            // Remove active class from all
            document.querySelectorAll('.character').forEach(char => {
                char.classList.remove('active');
                char.classList.add('sleeping');
            });
            
            // Add active class to selected
            const selected = document.querySelector(`[data-agent="${agent}"]`);
            selected.classList.add('active');
            selected.classList.remove('sleeping');
            
            console.log(`Woke up ${agent}!`);
        }

        // Switch tabs
        function switchTab(tab) {
            // Simplified - no tabs anymore
        }

        // Send message
        async function sendMessage() {
            if (isProcessing) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            isProcessing = true;
            input.value = '';
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;
            
            addMessage('You', message, 'user');
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        agent: selectedAgent
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    for (const [agentKey, responseText] of Object.entries(data.responses)) {
                        const agentName = agentKey.charAt(0).toUpperCase() + agentKey.slice(1);
                        addMessage(agentName, responseText, 'agent');
                    }
                } else {
                    throw new Error(data.error || 'Failed to process message');
                }
            } catch (error) {
                addMessage('Error', error.message, 'agent');
            }
            
            isProcessing = false;
            input.disabled = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        }

        function addMessage(sender, content, type) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `
                <div class="message-sender">${sender}</div>
                <div>${content}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Initialize
        console.log('AI Team Dashboard loaded!');
    </script>
</body>
</html>
